name: Discord Bot Test Suite
on: [push, workflow_dispatch]

env:
  APP_DEBUG: true
  APP_KEY: base64:thr0cf8rl0x8VY7D9UqOM97AL2237TjtpKbjO1I0eok=
  DB_CONNECTION: mysql
  DB_DATABASE: testing
  DB_USERNAME: root
  WEBHOOK_KEY: test-key-please-ignore

permissions: read-all

jobs:
  coding-standards:
    name: PHP Coding Standards
    runs-on: 'ubuntu-latest'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, intl, json, mbstring, openssl, simplexml
          coverage: xdebug

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install PHP Dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Verify Coding Standards
        env:
          PHP_CS_FIXER_IGNORE_ENV: true
        run: vendor/bin/php-cs-fixer fix --diff --dry-run

  static-analysis:
    name: Static Analysis
    runs-on: 'ubuntu-latest'

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, intl, json, mbstring, openssl, simplexml
          coverage: xdebug

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install PHP Dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Run Static Analysis
        run: vendor/bin/phpstan analyze --no-progress

  tests:
    name: Tests
    runs-on: 'ubuntu-latest'

    env:
      APP_ENV: testing

    services:
      mysql:
        image: mysql:8.0
        env:
            MYSQL_ALLOW_EMPTY_PASSWORD: yes
            MYSQL_DATABASE: ${{ env.DB_DATABASE }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, intl, json, mbstring, openssl, simplexml
          coverage: xdebug

      - name: Install PHP Dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Run Tests
        run: php artisan test --without-tty

  build-and-push-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    needs: [coding-standards, static-analysis, tests]

    env:
      DOCKER_HUB_USER: phlak

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract Metadata
        id: extract-metadata
        uses: docker/metadata-action@v6
        with:
          images: phlak/discord-bot
          tags: |
            type=raw,value=latest
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=tag

      - name: Build & Push Image
        uses: docker/build-push-action@v7.3.0
        with:
          file: Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.extract-metadata.outputs.tags }}
          labels: ${{ steps.extract-metadata.outputs.labels }}
